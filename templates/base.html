{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Hospital Management</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">Hospital</a>

        <div>

            <a class="text-white me-3" href="/">Home</a>

            <a class="text-white me-3" href="/patients/">
                Patients
            </a>

            {% if user.is_authenticated %}

                <span class="text-white me-3">
                    Welcome {{ user.username }}
                </span>

                <a class="text-white" href="/logout/">
                    Logout
                </a>

            {% else %}

                <a class="text-white me-3" href="/login/">
                    Login
                </a>

                <a class="text-white" href="/register/">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

    <hr>

    {% block content %}

    {% endblock %}

</body>

</html>
